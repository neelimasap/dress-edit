<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff">
<title>Tiya's Fashion</title>
<style>
:root{--ink:#111;--mute:#7a7a7a;--line:#ececec;--acc:#c4677c;--blush:#f8ecee;--bg:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 "Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.serif{font-family:"Cormorant Garamond",Didot,"Bodoni 72","Playfair Display",Georgia,serif;font-weight:500}
button{font:inherit;color:inherit}
header{text-align:center;padding:18px 16px 10px;border-bottom:1px solid var(--line)}
.mark{font-size:12px;letter-spacing:.42em;text-transform:uppercase;font-weight:400;margin:0}
.mark .bow{color:var(--acc);letter-spacing:0;font-size:11px;margin-left:4px}
.tag{font-size:26px;margin:6px 0 2px;letter-spacing:.01em}
.meta{color:var(--mute);font-size:11px;letter-spacing:.04em}
.stats{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px 0}
.stats b{color:var(--ink);font-weight:600}
.bar{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brands{display:flex;gap:18px;overflow-x:auto;padding:12px 16px 9px;scrollbar-width:none;white-space:nowrap}.brands::-webkit-scrollbar{display:none}
.brands button{background:none;border:0;padding:0 0 4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);cursor:pointer;border-bottom:1.5px solid transparent}
.brands button.on{color:var(--ink);border-color:var(--ink)}
.tools{display:flex;border-top:1px solid var(--line)}
.tools button{flex:1;background:none;border:0;padding:11px 6px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
.tools button+button{border-left:1px solid var(--line)}
.tools .n{color:var(--acc)}
.wrap{max-width:1280px;margin:0 auto}
.watch{display:flex;align-items:center;gap:12px;margin:14px 16px 0;padding:12px 14px;background:var(--blush);text-decoration:none;color:var(--ink)}
.watch .k{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--acc)}
.watch .t{font-size:17px;line-height:1.15}
.watch .s{font-size:11px;color:var(--mute)}
.watch .go{margin-left:auto;font-size:18px}
h2{font-size:24px;margin:22px 16px 10px;display:flex;align-items:baseline;justify-content:space-between}
h2 small{font:11px "Helvetica Neue",Arial,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 2px}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:34px 14px;padding:0 16px}}
.p{position:relative;cursor:pointer;min-width:0}
.ph{position:relative;aspect-ratio:3/4;background:#f6f4f3;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .35s}
.ph .b2{opacity:0}
@media(hover:hover){.p:hover .ph .b2{opacity:1}}
.ph0{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#b9b2b4;font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.ph0 .serif{font-size:22px;letter-spacing:.02em;text-transform:none;color:#a99}
.hrt{position:absolute;right:6px;top:6px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.hrt svg{width:20px;height:20px;fill:#fff8;stroke:#111;stroke-width:1.3}
.hrt.on svg{fill:var(--acc);stroke:var(--acc)}
.flag{position:absolute;left:0;bottom:0;background:#fff;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 7px}
.info{padding:9px 8px 0}
.br{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444;margin:1px 0 3px}
.pr{font-size:12.5px}.pr s{color:var(--mute);margin:0 5px}.pr .o{color:var(--acc)}
.sz{font-size:10.5px;color:var(--mute);margin-top:2px}
/* sheets */
.scrim{position:fixed;inset:0;background:#0004;opacity:0;pointer-events:none;transition:.25s;z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:#fff;z-index:50;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:6px 18px 22px}
@media(min-width:900px){.sheet{left:auto;top:0;bottom:0;width:420px;max-height:none;transform:translateX(102%)}}
.open .scrim{opacity:1;pointer-events:auto}
body.f .sh-f,body.q .sh-q{transform:none}
.grab{width:36px;height:4px;background:#ddd;border-radius:2px;margin:6px auto 10px}
.sheet h3{font-size:22px;margin:4px 0 6px}
.sheet h4{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;margin:16px 0 8px;font-weight:600}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid #d9d9d9;background:#fff;padding:8px 12px;font-size:12px;cursor:pointer;border-radius:2px}
.opt.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sbtn{display:block;width:100%;text-align:center;background:var(--ink);color:#fff;border:0;padding:14px;font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;margin-top:18px;cursor:pointer}
.ghost{background:#fff;color:var(--ink);border:1px solid var(--ink);margin-top:8px}
.qv{display:flex;flex-direction:column;gap:12px}
.qv .ph{width:100%;max-width:340px;margin:0 auto}
.qv .row{font-size:12px;border-top:1px solid var(--line);padding:8px 0;display:flex;gap:10px}.qv .row b{min-width:76px;font-weight:600;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding-top:1px}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}
.sizes{margin:0 16px;font-size:12px;line-height:1.8;columns:2 260px}
.sizes b{font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:10.5px}
footer{text-align:center;color:var(--mute);font-size:10.5px;letter-spacing:.06em;padding:30px 16px 46px}
</style></head><body>

<script>
const {items,meta}=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s);const byId=Object.fromEntries(items.map(i=>[i.id,i]));
const saved=new Set(JSON.parse(localStorage.getItem('dd_saved')||'[]'));
const st={brand:'All',style:new Set(),size:'All',price:'All',onlyNew:false,onlySale:false,onlySaved:false,sort:'best'};
const BR=['All',...new Set(items.map(i=>i.brand))];
const STY={floral:'Floral & print',corset:'Corset & structured',lace:'Lace & embroidery',linen:'Linen & button-front'};
const PR={All:'Any',lt300:'Under $300',m:'$300–700',gt700:'$700+'};
const SO={best:'Best match',pct:'% off',lo:'Price low–high',hi:'Price high–low',new:'Newest'};
const sym=c=>c==='GBP'?'£':c==='AUD'?'A$':'$';
const usd=i=>i.price*(i.currency==='GBP'?1.27:i.currency==='AUD'?0.66:1);
const money=(v,c)=>sym(c)+(v%1?v.toFixed(2):v.toLocaleString());
const prc=i=>i.was?`${i.price_from?'from ':''}${money(i.price,i.currency)}<s>${money(i.was,i.currency)}</s><span class="o">-${i.pct}%</span>`:`${money(i.price,i.currency)} <span style="color:var(--mute)">· Full price</span>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEART='<svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg>';
$('#upd').textContent='Updated '+meta.updated;
const cnt={};items.forEach(i=>cnt[i.brand]=(cnt[i.brand]||0)+1);

const photo=(i,big)=>`<div class="ph">${i.img?`<img loading="lazy" src="${i.img}" alt="${esc(i.name)}">${i.img2&&!big?`<img class="b2" loading="lazy" src="${i.img2}" alt="">`:''}`:`<div class="ph0"><span class="serif">${esc(i.brand)}</span>Photo at store</div>`}
 <button class="hrt ${saved.has(i.id)?'on':''}" data-h="${i.id}" aria-label="Save">${HEART}</button>${i.new?'<span class="flag">New</span>':i.final_sale?'<span class="flag">Final sale</span>':''}</div>`;
const card=i=>`<div class="p" data-q="${i.id}">${photo(i)}<div class="info"><div class="br">${esc(i.brand)}</div><div class="nm">${esc(i.name)}</div>
 <div class="pr">${prc(i)}</div><div class="sz">${i.sizes.join(' · ')} · ${esc(i.retailer.split(' (')[0])}${i.also&&i.also.length?` · +${i.also.length} more`:''}</div></div></div>`;
function bar(){
 $('#brands').innerHTML=BR.map(b=>`<button class="${st.brand===b?'on':''}" data-b="${b}">${b==='All'?'All':b} <span style="opacity:.55">${b==='All'?items.length:cnt[b]}</span></button>`).join('');
 const n=st.style.size+(st.size!=='All')+(st.price!=='All')+st.onlyNew+st.onlySale; $('#fn').textContent=n?`(${n})`:'';
 $('#svn').textContent=saved.size?`(${saved.size})`:''; $('#svB').style.color=st.onlySaved?'var(--acc)':'';
}
function filt(){
 const o=(k,v,l,on)=>`<button class="opt ${on?'on':''}" data-${k}="${v}">${l}</button>`;
 $('#shF').innerHTML=`<div class="grab"></div><h3 class="serif">Filter & sort</h3>
 <h4>Style</h4><div class="opts">${Object.entries(STY).map(([k,v])=>o('s',k,v,st.style.has(k))).join('')}</div>
 <h4>Size</h4><div class="opts">${['All','US 6','US 8'].map(z=>o('z',z,z==='All'?'US 6 or 8':z,st.size===z)).join('')}</div>
 <h4>Price</h4><div class="opts">${Object.entries(PR).map(([k,v])=>o('p',k,v,st.price===k)).join('')}</div>
 <h4>Show</h4><div class="opts">${o('nw',1,'New only',st.onlyNew)}${o('sl',1,'On sale only',st.onlySale)}</div>
 <h4>Sort by</h4><div class="opts">${Object.entries(SO).map(([k,v])=>o('o',k,v,st.sort===k)).join('')}</div>
 <button class="sbtn" data-close="1">Show ${list().length} dresses</button><button class="sbtn ghost" data-clear="1">Clear all</button>`;
}
function list(){
 let L=items.filter(i=>(st.brand==='All'||i.brand===st.brand)&&[...st.style].every(s=>i.styles.includes(s))&&(st.size==='All'||i.sizes.includes(st.size))
  &&(!st.onlyNew||i.new)&&(!st.onlySale||i.was)&&(!st.onlySaved||saved.has(i.id))&&(st.price==='All'||(st.price==='lt300'?usd(i)<300:st.price==='m'?usd(i)>=300&&usd(i)<=700:usd(i)>700)));
 const S={best:(a,b)=>b.score-a.score,pct:(a,b)=>b.pct-a.pct,lo:(a,b)=>usd(a)-usd(b),hi:(a,b)=>usd(b)-usd(a),new:(a,b)=>(b.new-a.new)||b.score-a.score};
 return L.sort(S[st.sort]);
}
function render(){const L=list();
 $('#cnt').innerHTML=`${st.onlySaved?'Saved':st.brand==='All'?'All dresses':esc(st.brand)}${st.brand!=='All'||st.onlySaved||L.length!==items.length?` <small>${L.length} shown</small>`:''}`;
 $('#grid').innerHTML=L.map(card).join('')||'<div class="empty">Nothing here yet. Try fewer filters.</div>';bar();}
function quick(i){
 $('#shQ').innerHTML=`<div class="grab"></div><div class="qv">${photo(i,1)}<div><div class="br">${esc(i.brand)}</div><h3 class="serif" style="margin:2px 0">${esc(i.name)}</h3>
 <div class="pr" style="font-size:15px">${prc(i)}</div></div>
 <div><div class="row"><b>Size</b><span>${esc(i.size_label)}</span></div><div class="row"><b>Stock</b><span>${i.final_sale&&!/Final/.test(i.stock)?'Final sale · ':''}${esc(i.stock)}</span></div>
 ${i.also&&i.also.length?`<div class="row"><b>${i.also.some(a=>a.retailer!==i.retailer)?'Also at':'Also in'}</b><span>${i.also.map(a=>`<a href="${esc(a.url)}" target="_blank" rel="noopener" style="color:inherit;display:block">${esc(a.color||'Other colorway')} — ${a.from?'from ':''}${money(a.price,a.currency)} · ${a.sizes.join('/')}${a.retailer!==i.retailer?' · '+esc(a.retailer.split(' (')[0]):''}</a>`).join('')}</span></div>`:''}<div class="row"><b>Style</b><span>${i.styles.map(s=>STY[s]).join(' · ')||'—'}</span></div><div class="row"><b>Store</b><span>${esc(i.retailer)}${i.checked?' · checked '+esc(i.checked):''}${i.color?' · '+esc(i.color):''}</span></div></div>
 <a class="sbtn" href="${esc(i.url)}" target="_blank" rel="noopener">Shop at ${esc(i.retailer.split(' (')[0])}</a></div>`;open('q');}
function open(k){document.body.classList.add('open',k);} function close(){document.body.classList.remove('open','f','q');}
if(meta.watch){const w=meta.watch;$('#watchS').innerHTML=`<a class="watch" href="${esc(w.url)}" target="_blank" rel="noopener"><div><div class="k">On watch</div><div class="t serif">${esc(w.brand)} ${esc(w.name)}</div><div class="s">${esc(w.color)} · $${w.price.toLocaleString()} · ${esc(w.note)}</div></div><span class="go">→</span></a>`;}
$('#sizes').innerHTML=Object.entries(meta.sizes).map(([b,s])=>`<div><b>${esc(b)}</b> — ${esc(s)}</div>`).join('');
document.addEventListener('click',e=>{const t=e.target.closest('[data-h],[data-b],[data-s],[data-z],[data-p],[data-o],[data-nw],[data-sl],[data-close],[data-clear],[data-q],#openF,#openS,#svB,#scrim');if(!t)return;
 const d=t.dataset;
 if(d.h){e.stopPropagation();saved.has(d.h)?saved.delete(d.h):saved.add(d.h);localStorage.setItem('dd_saved',JSON.stringify([...saved]));document.querySelectorAll(`[data-h="${d.h}"]`).forEach(x=>x.classList.toggle('on',saved.has(d.h)));bar();if(st.onlySaved)render();return;}
 if(t.id==='scrim'||d.close){close();return;}
 if(t.id==='openF'||t.id==='openS'){filt();open('f');return;}
 if(t.id==='svB'){st.onlySaved=!st.onlySaved;render();return;}
 if(d.q){quick(byId[d.q]);return;}
 if(d.b)st.brand=d.b; else if(d.s){st.style.has(d.s)?st.style.delete(d.s):st.style.add(d.s)} else if(d.z)st.size=d.z; else if(d.p)st.price=d.p; else if(d.o)st.sort=d.o; else if(d.nw)st.onlyNew=!st.onlyNew; else if(d.sl)st.onlySale=!st.onlySale;
 else if(d.clear){st.style.clear();st.size='All';st.price='All';st.onlyNew=false;st.onlySale=false;st.sort='best';}
 render();if(document.body.classList.contains('f'))filt();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
render();
</script></body></html>
